<!DOCTYPE html><html lang=en><meta charset=utf-8><title>auto</title><body style="margin:0"><canvas id=c></canvas>
<script>// ============ THE LAST UNICORN ============
// world grid
var TS = 16, GW = 30, GH = 17, W = GW * TS, H = GH * TS;
var X = c.getContext('2d');

// bloom buffer (1/3 res)
var bc = document.createElement('canvas'), BX;
bc.width = 240; bc.height = 136; BX = bc.getContext('2d');

var VW = 1, VH = 1, SC = 1, OX = 0, OY = 0, DPR = 1, port = 0;
function resize() {
  DPR = Math.min(2, devicePixelRatio || 1);
  VW = innerWidth; VH = innerHeight;
  c.width = VW * DPR | 0; c.height = VH * DPR | 0;
  c.style.width = VW + 'px'; c.style.height = VH + 'px';
  port = touchOn && VH > VW * 1.2;
  SC = Math.min(VW / W, VH / H);
  OX = (VW - W * SC) / 2; OY = (VH - H * SC) * (port ? .3 : .5);
}
onresize = resize;

// ---- math ----
var M = Math, PI = M.PI, TAU = PI * 2;
var sin = M.sin, cos = M.cos, abs = M.abs, min = M.min, max = M.max, flr = M.floor, hyp = M.hypot;
function clamp(v, a, b) { return v < a ? a : v > b ? b : v }
function lerp(a, b, t) { return a + (b - a) * t }
// deterministic hash-noise (never used in sim, only decor)
function rnd(n) { n = sin(n * 127.1 + 311.7) * 43758.5453; return n - flr(n) }

// ---- tile ids ----
var EMPTY = 0, SOLID = 1, CLOUD = 2, THORN = 3, GOAL = 4, EMIT = 5, MIRR = 6,
    PRIS = 7, FILT = 8, RECV = 9, DOOR = 10, PLATE = 11, SOCK = 12;

// grid char -> [type, param]
// param: EMIT=dir | MIRR = orient | (grp+1)<<1 | FILT/RECV/DOOR = colour mask | PLATE = grp
var CH = {};
function def(s, t, f) { for (var i = 0; i < s.length; i++) CH[s[i]] = [t, f(i, s[i])] }
def('#', SOLID, () => 0);
def('=', CLOUD, () => 0);
def('x', THORN, () => 0);
def('C', GOAL, () => 0);
def('><v^', EMIT, i => [0, 2, 1, 3][i]);          // right left down up
def('/\\', MIRR, i => i);                          // fixed mirrors
def('AaDdEe', MIRR, i => (i & 1) | ((i >> 1) + 1) << 1); // toggle: grp 0,1,2
def('p', PRIS, () => 0);
def('rgbykm', FILT, i => [1, 2, 4, 3, 6, 5][i]);
def('RGBYKM', RECV, i => [1, 2, 4, 3, 6, 5][i]);
def('W', RECV, () => 7);
def('123456789', DOOR, i => i + 1);
def('!@$', PLATE, i => i);
def('O', SOCK, () => 0);

// colour by mask (0..8 used)
var COL = [, '#f24', '#4e6', '#fd4', '#49f', '#f5e', '#5ef', '#fff', '#fc3'];
// darker rim
var COLD = [, '#801', '#180', '#951', '#026', '#809', '#088', '#889', '#940'];

// direction vectors  0=R 1=D 2=L 3=U
var DX = [1, 0, -1, 0], DY = [0, 1, 0, -1];

// ---- input ----
// three sources OR'd into one action map: 1=left 2=right 4=jump 8=action
// meta: 1=new loop 2=undo 4=fast-forward 8=restart level 16=any-key 32=mute
var K = 0, KP = 0, meta = 0, MP = 0, kbK = 0, kbM = 0, tK = 0, tM = 0, gpK = 0, gpM = 0, anyK = 0;
var kmap = { ArrowLeft: 1, KeyA: 1, ArrowRight: 2, KeyD: 2, ArrowUp: 4, KeyW: 4, Space: 4, KeyZ: 4,
             KeyX: 8, ArrowDown: 8, KeyS: 8 };
var mmap = { KeyR: 1, Enter: 1, KeyQ: 2, Backspace: 2, ShiftLeft: 4, ShiftRight: 4, Tab: 4,
             KeyT: 8, KeyM: 32, KeyC: 64, Escape: 128 };
onkeydown = e => {
  if (e.metaKey || e.ctrlKey) return;
  if (e.code == 'Tab' || e.code == 'Space' || e.code.slice(0, 5) == 'Arrow') e.preventDefault();
  kbK |= kmap[e.code] | 0; kbM |= mmap[e.code] | 0; anyK = 1; A0();
};
onkeyup = e => { kbK &= ~(kmap[e.code] | 0); kbM &= ~(mmap[e.code] | 0) };
onblur = () => { kbK = kbM = 0 };

var touchOn = 'ontouchstart' in self;
var RM = 0;
try { RM = +matchMedia('(prefers-reduced-motion:reduce)').matches } catch (e) {}
function tpt(t) { return [(t.clientX - OX) / SC, (t.clientY - OY) / SC] }
function tupd(e) {
  e.preventDefault(); touchOn = 1; anyK = 1; A0();
  var k = 0, m = 0, i, p, q, sx, sy, ddx, ddy, ph;
  for (i = 0; i < e.touches.length; i++) {
    sx = e.touches[i].clientX; sy = e.touches[i].clientY;
    if (!port) {
      p = tpt(e.touches[i]);
      if (p[1] > H * .46) k |= p[0] < W * .13 ? 1 : p[0] < W * .27 ? 2 : p[0] > W * .87 ? 8 : p[0] > W * .72 ? 4 : 0;
      else if (p[0] > W * .87) m |= 1; else if (p[0] > W * .74) m |= 2; else if (p[0] < W * .13) m |= 4;
      else if (p[0] > W * .43 && p[0] < W * .57) m |= 128;
    } else {
      ph = VH - (OY + H * SC);
      if (sy < OY + H * SC) { k |= 4; continue }          // screen tap: jump / begin / skip
      ddx = sx - VW * .2; ddy = sy - OY - H * SC - ph * .36;
      var rr = M.min(ph * .19, VW * .125);
      if (ddx * ddx + ddy * ddy < rr * rr * 1.25) {        // d-pad cross
        if (abs(ddx) > abs(ddy)) k |= ddx < 0 ? 1 : 2; else k |= ddy < 0 ? 4 : 8;
      } else if (abs(sx - VW * .8) < rr * .8 && abs(ddy) < rr * .8) k |= 4;   // A
      if (abs(sy - (OY + H * SC + ph * .78)) < ph * .065)
        for (q = 0; q < 4; q++)
          if (sx > VW * (.26 + q * .125) && sx < VW * (.26 + q * .125 + .105))
            m |= [2, 128, 4, 1][q];
    }
  }
  tK = k; tM = m;
}
addEventListener('touchstart', tupd, { passive: 0 });
addEventListener('touchmove', tupd, { passive: 0 });
addEventListener('touchend', tupd, { passive: 0 });
addEventListener('touchcancel', tupd, { passive: 0 });
addEventListener('pointerdown', () => { anyK = 1; A0() });

function pad() {
  var g = navigator.getGamepads ? navigator.getGamepads()[0] : 0, k = 0, m = 0, b, i;
  if (!g) { gpK = gpM = 0; return }
  b = i => g.buttons[i] && g.buttons[i].pressed;
  var ax = g.axes[0] || 0;
  if (ax < -.4 || b(14)) k |= 1;
  if (ax > .4 || b(15)) k |= 2;
  if (b(0) || b(12)) k |= 4;
  if (b(2) || b(13)) k |= 8;
  if (b(1)) m |= 1;
  if (b(3)) m |= 2;
  if (b(5) || b(7) || b(4) || b(6)) m |= 4;
  if (b(9)) m |= 8;
  if (b(10)) m |= 64;
  if (b(8)) m |= 128;
  if (k | m) anyK = 1;
  gpK = k; gpM = m;
}
function buzz(ms, s) {                 // gamepad rumble + phone haptics; silent no-op elsewhere
  var g = self.navigator && navigator.getGamepads && navigator.getGamepads()[0], v = g && g.vibrationActuator;
  if (v) try { v.playEffect('dual-rumble', { duration: ms, strongMagnitude: s }) } catch (e) {}
  try { if (self.navigator && navigator.vibrate) navigator.vibrate(ms) } catch (e) {}
}
function inputPoll() {
  pad();
  var nk = kbK | tK | gpK, nm = kbM | tM | gpM;
  KP = nk & ~K; K = nk;
  MP = (nm & ~meta) | (anyK ? 16 : 0); meta = nm; anyK = 0;
  if (MP & 32) { MUT ^= 1; if (MUT) musStop(); else musStart() }
}

// ================= AUDIO =================
// The music loop is EXACTLY 13.000s and restarts with every time loop, so the
// song is the clock: 13 beats, one accent per second. 13/4 is a subtly wrong
// meter, which is free cosmic horror.
var A = 0, MG, MUT = 0, cr = 0, MBUF = 0, MSRC = 0, MCR = -1, sq = 1;
function A0() {
  if (A) { if (A.state == 'suspended') A.resume(); return }
  A = new (self.AudioContext || self.webkitAudioContext)();
  MG = A.createGain(); MG.gain.value = .55;
  var cmp = A.createDynamicsCompressor();
  MG.connect(cmp); cmp.connect(A.destination);
  musStart();
}
function rnf() { sq = (sq * 1103515245 + 12345) & 2147483647; return sq / 1073741824 - 1 }

// ---- one-shot voices (sfx) ----
function tone(f, t, d, ty, v, sl) {
  if (!A || MUT) return;
  var o = A.createOscillator(), g = A.createGain();
  o.type = ty; o.frequency.setValueAtTime(f, t);
  if (sl != 1) o.frequency.exponentialRampToValueAtTime(max(24, f * sl), t + d);
  g.gain.setValueAtTime(1e-4, t);
  g.gain.exponentialRampToValueAtTime(v, t + .006);
  g.gain.exponentialRampToValueAtTime(1e-4, t + d);
  o.connect(g); g.connect(MG); o.start(t); o.stop(t + d + .03);
}
// 0 jump 1 land 2 power 3 socket 4 grab 5 loop 6 nope 7 win 8 tick 9 alarm 10 poof 11 unpower
var SFX = [
  [430, .1, 0, .17, 2.3], [150, .07, 1, .15, .6], [700, .13, 3, .12, 1.5],
  [520, .2, 3, .13, 2], [880, .07, 0, .11, 1.6], [300, .3, 1, .14, .35],
  [90, .16, 2, .12, .8], [523, .45, 3, .18, 2], [1500, .02, 0, .04, 1],
  [1900, .05, 0, .09, .7], [420, .16, 2, .1, .5],
];
var vc = 0, vt = 0;
function sfx(n) {
  if (!A || MUT) return;
  var t = A.currentTime;
  if (t != vt) { vt = t; vc = 0 }
  if (++vc > 4) return;                       // voice cap: 5 ghosts landing at once must not clip
  var s = SFX[n], dt = (vc - 1) * .012;
  tone(s[0] * (1 + dt), t + dt, s[1], ['square', 'triangle', 'sawtooth', 'sine'][s[2]], s[3], s[4]);
  if (n == 5) tone(s[0] * 1.5, t + .05, .25, 'triangle', .1, .4);
  if (n == 3 || n == 7) for (var i = 1; i < 4; i++) tone(s[0] * (1 + i * .26), t + i * .07, .3, 'triangle', .11, 1.3);
}

// ---- the 13 second song ----
function nf(n) { return 261.63 * M.pow(2, n / 12) }
// wave: 0 square 1 tri 2 saw 3 sine 4 noise
function put(d, N, sr, t0, dur, f, amp, wave, dec) {
  var i0 = t0 * sr | 0, n = dur * sr | 0, ph = 0, dp = f / sr, i, v, e, at = sr * .004;
  for (i = 0; i < n; i++) {
    e = min(1, i / at) * M.pow(1 - i / n, dec);
    ph += dp; ph -= ph | 0;
    v = wave == 0 ? (ph < .5 ? 1 : -1) : wave == 1 ? 4 * abs(ph - .5) - 1
      : wave == 2 ? 2 * ph - 1 : wave == 3 ? sin(ph * TAU) : rnf();
    d[(i0 + i) % N] += v * e * amp;
  }
}
var MEL = "H E A E H   J H L H C H L   J H J E A E J   M L F E ";
function renderSong(dr) {
  var sr = A.sampleRate, N = M.round(13 * sr), buf = A.createBuffer(1, N, sr), d = buf.getChannelData(0);
  var STEP = .25, S = 52, i, s, beat, rt, th, fi, ch, n, det = 1 - dr * .014;
  th = dr > .3 ? 3 : 4; fi = dr > .7 ? 6 : 7;
  sq = 1;
  for (s = 0; s < S; s++) {
    var t = s * STEP; beat = s >> 2;
    rt = [0, 0, 0, 0, 7, 7, 7, 7, 9, 9, 9, 9, 5][beat];
    ch = [rt, rt + th, rt + fi];
    if (!(s & 3)) {                                   // one accent per second: the clock
      put(d, N, sr, t, .3, nf(rt - 24) * det, .3, 1, 2.4);
      put(d, N, sr, t, .05, 60, .18 * (1 - dr * .4), 4, 6);
    }
    put(d, N, sr, t, .16, nf(ch[s % 3] - 12 + (s % 8 > 3 ? 12 : 0)) * det, .07, dr > .6 ? 1 : 0, 3);
    n = MEL.charCodeAt(s) - 65;
    if (n >= 0) {
      if (dr > .3 && (n == 4 || n == 9 || n == 11)) n--;
      put(d, N, sr, t, .3, nf(n) * det, .1, dr > .55 ? 2 : 0, 2.6);
    }
    if ((s & 1) && dr < .8) put(d, N, sr, t, .035, 9000, .035 * (1 - dr), 4, 5);
    if (dr > .35 && !(s % 16)) put(d, N, sr, t, 4.2, nf(rt - 36) * 1.006, .1 * dr, 2, .35);
  }
  if (dr > .5) for (i = 0; i < N; i++) d[i] += rnf() * .006 * dr;    // tape hiss
  for (i = 0; i < N; i++) d[i] = clamp(d[i], -.92, .92);
  return buf;
}
function musStart() {
  if (!A || MUT) return;
  var k = M.round(cr * 4) / 4;
  if (MCR != k) { MCR = k; MBUF = renderSong(k) }
  if (MSRC) try { MSRC.stop() } catch (e) {}
  MSRC = A.createBufferSource(); MSRC.buffer = MBUF; MSRC.loop = 1;
  MSRC.connect(MG); MSRC.start();
}
function musStop() { if (MSRC) { try { MSRC.stop() } catch (e) {} MSRC = 0 } }

// ================= SIMULATION =================
var TT, TP, racc, bfloor, plates = [0, 0, 0], plateBy = [-1, -1, -1], power = 0, pulse = 0, pwOld = 0;
var segs = [], spX, spY, stX, stY, hasStar, gndY = 224;
var LOOPF = 780;                       // 13 seconds @ 60
var ghosts = [], actors = [], rec, frame = 0, star = 0, pl;

function idx(cx, cy) { return cy * GW + cx }

function parseLevel(m) {
  TT = new Uint8Array(GW * GH); TP = new Uint8Array(GW * GH);
  racc = new Uint8Array(GW * GH); bfloor = new Uint8Array(GW * GH);
  hasStar = 0; spX = 24; spY = 100;
  var rows = m.split('\n'), y, x, ch, d;
  for (y = 0; y < GH; y++) {
    for (x = 0; x < GW; x++) {
      ch = (rows[y] || '')[x] || '.';
      if (ch == 'S') { spX = x * TS + 8; spY = y * TS + 15.99; continue }
      if (ch == '*') { hasStar = 1; stX = x * TS + 8; stY = y * TS + 11; continue }
      d = CH[ch];
      if (d) {
        TT[idx(x, y)] = d[0]; TP[idx(x, y)] = d[1];
      }
    }
  }
  findGround();
}

// find the top of the main floor slab, so the chasm shading only darkens actual pits
var chG = 0;
function findGround() {
  var y, x, cnt, t, gnd = GH;
  for (y = GH - 1; y >= 0; y--) {
    cnt = 0;
    for (x = 0; x < GW; x++) { t = TT[idx(x, y)]; if (t == SOLID || t == PLATE || t == DOOR) cnt++ }
    if (cnt < 6) break;
    gnd = y;
  }
  gndY = gnd * TS;
  var y0 = gndY - 6;
  chG = X.createLinearGradient(0, y0, 0, H);
  chG.addColorStop(0, 'rgba(30,15,50,0)');
  chG.addColorStop(.3, 'rgba(24,11,42,.55)');
  chG.addColorStop(1, 'rgba(8,3,18,.97)');
}

// ---------- collision queries ----------
function solidCell(cx, cy) {
  if (cy >= GH) return 0;            // the world has no floor - pits are bottomless
  if (cx < 0 || cy < 0 || cx >= GW) return 1;
  var i = idx(cx, cy), t = TT[i];
  if (t == DOOR) return (power & TP[i]) == TP[i] ? 0 : 1;
  return t == SOLID || t > 4 && t < 10 || t == PLATE ? 1 : 0;
}
function owTop(cx, cy) {          // one-way platform surface, -1 none
  if (cx < 0 || cx >= GW || cy < 0 || cy >= GH) return -1;
  var i = idx(cx, cy);
  if (TT[i] == CLOUD) return cy * TS + 4;
  if (bfloor[i]) return cy * TS + 8;
  return -1;
}
function boxSolid(x, y, w, h) {
  var x0 = flr((x - w) / TS), x1 = flr((x + w - .01) / TS),
      y0 = flr((y - h) / TS), y1 = flr((y - .01) / TS), cx, cy;
  for (cy = y0; cy <= y1; cy++) for (cx = x0; cx <= x1; cx++) if (solidCell(cx, cy)) return 1;
  return 0;
}

// ---------- actor ----------
var AW = 5, AH = 12;
function mkActor(i) {
  return { i: i, x: spX, y: spY, vx: 0, vy: 0, g: 0, pg: 0, f: 1, ct: 0, jb: 0, pj: 0,
           dead: 0, hold: 0, sq: 1, an: 0, pt: [] };
}

// ---------- beams ----------
// A unicorn's torso casts a shadow. The band (y-11 .. y-3) excludes the feet,

  }

}
function traceBeams() {

  for (i = 0; i < GW * GH; i++) if (TT[i] == EMIT) q.push([i % GW, (i / GW) | 0, TP[i], 7]);
  while (q.length && n < 500) {

    var ax = cx * TS + 8, ay = cy * TS + 8, key, ix, brk = 0, nd;
    for (; !brk;) {

      if (seen[key]) { brk = 4; break } seen[key] = 1;
      cx += DX[d]; cy += DY[d];
      if (cx < 0 || cy < 0 || cx >= GW || cy >= GH) { brk = 2; break }
      ix = idx(cx, cy); t = TT[ix]; p = TP[ix];
      if (t == SOLID || t == EMIT || t == PLATE) { brk = 2; break }
      if (t == DOOR && (power & p) != p) { brk = 2; break }
      if (t == RECV) { racc[ix] |= mk; brk = 1; break }
      if (eclipsed(cx, cy, d)) { brk = 2; break }

}

// ---------- world reset ----------
var won = 0, loopFlash = 0;
function resetWorld() {
  frame = 0; won = 0; power = 0; loopFlash = 1;

  pl = actors[ghosts.length];
  star = hasStar ? { x: stX, y: stY, vx: 0, vy: 0, h: 0, in: 0, cd: 0 } : 0;
  for (var ri = 0; ri < actors.length; ri++)          // the herd re-forms in a shower

}
function commitLoop() {
  if (frame < 5) { sfx(6); resetWorld(); return }
  if (ghosts.length + 1 > allow() && spareLeft() < 1) { denied = 2.6; sfx(6); return }
  var n = frame || 1;                                   // guarantee ≥1 frame of life
  ghosts.push({ i: rec.slice(0, frame), n: n, pt: pl.pt }); sfx(5);

function stuck() { return ghosts.length + 1 > allow() && spareLeft() < 1 }
function undoLoop() { if (ghosts.length) { ghosts.pop(); sfx(6) } resetWorld() }

// ---------- one sim tick ----------
function step() {
  var i, a, g;
  for (i = 0; i < ghosts.length; i++) {
    a = actors[i]; g = ghosts[i];
    if (frame >= g.n) { if (!a.dead) { a.dead = 1; burst(a.x, a.y - 7, 7, 10) } continue }
    stepActor(a, g.i[frame], 0);
  }
  rec[frame] = K & 15;
  stepActor(pl, K & 15, 1);

  // star physics
  if (star) {
    if (star.h) {
      star.x = star.h.x; star.y = star.h.y - 20; star.vx = star.vy = 0;
      if (seat()) { star.h.hold = 0; star.h = 0 }
    } else if (!star.in) {
      if (star.cd) star.cd--;
      star.vy += .4; if (star.vy > 7) star.vy = 7;
      star.x += star.vx;
      if (boxSolid(star.x, star.y + 4, 4, 8)) { star.x = star.vx > 0 ? flr((star.x + 4) / TS) * TS - 4.01 : (flr((star.x - 4) / TS) + 1) * TS + 4.01; star.vx *= -.4 }
      var py = star.y; star.y += star.vy;
      if (boxSolid(star.x, star.y + 4, 4, 8)) {
        star.y = star.vy > 0 ? flr((star.y + 4) / TS) * TS - 4.01 : (flr((star.y - 4) / TS) + 1) * TS + 4.01;

            if (t2 >= 0 && py + 4 <= t2 + 1.5 && star.y + 4 >= t2) { star.y = t2 - 4; star.vy = 0; star.vx *= .8 }
          }
      }
      seat();
      if (star.y > H + 30) { star.x = stX; star.y = stY; star.vx = star.vy = 0 }
    }
  }
  // plates
  plates[0] = plates[1] = plates[2] = 0;
  plateBy[0] = plateBy[1] = plateBy[2] = -1;
  for (i = 0; i < actors.length; i++) {
    a = actors[i]; if (a.dead) continue;

  }
  if (star && !star.h && !star.in) press(star.x, star.y + 7, 4, -2);
  var pw = plates[0] | plates[1] << 1 | plates[2] << 2;

}
function seat() {                      // snap the star into a socket it overlaps
  var sc = idx(clamp(flr(star.x / TS), 0, GW - 1), clamp(flr(star.y / TS), 0, GH - 1));

    i = idx(cx, cy);
    if (TT[i] == PLATE) { plates[TP[i]] = 1; if (plateBy[TP[i]] < 0) plateBy[TP[i]] = who }

// ================= RENDER =================
var T = 0, shake = 0, P = [], RB = ['#f45', '#f83', '#fd4', '#5d6', '#49f', '#a5f'], HG = 0;
var F1 = '"Comic Sans MS","Chalkboard SE",system-ui,sans-serif';

// ---------- particles: x y vx vy life max mask size ----------

  for (var i = 0; i < n; i++) {
    var a = rnd(T * 91 + i * 7.3) * TAU, s = .4 + rnd(i * 3.1 + T) * 2.4;
    pp(x, y, cos(a) * s, sin(a) * s - .6, 18 + rnd(i) * 22 | 0, mk, 1 + rnd(i * 5) * 1.8);
  }
}
function stepP() {
  for (var i = 0; i < P.length; i += 8) {
    P[i] += P[i + 2]; P[i + 1] += P[i + 3]; P[i + 3] += .045; P[i + 2] *= .985; P[i + 4]--;
    if (P[i + 4] <= 0) { P.splice(i, 8); i -= 8 }
  }
}

}

// ---------- colour-blind redundancy pips ----------
function pips(g, x, y, mk, s) {
  var n = 0, i, b, px;
  for (i = 0; i < 4; i++) if (mk >> i & 1) n++;
  for (i = 0, b = 0; i < 4; i++) {
    if (!(mk >> i & 1)) continue;
    px = x + (b - (n - 1) / 2) * (s * 2.3); b++;
    g.fillStyle = COL[1 << i]; g.beginPath();
    if (i == 0) { g.moveTo(px, y - s); g.lineTo(px + s, y + s); g.lineTo(px - s, y + s) }
    else if (i == 1) g.rect(px - s * .85, y - s * .85, s * 1.7, s * 1.7);
    else g.arc(px, y, s, 0, TAU);

}

// ---------- the unicorn ----------
function uni(g, a, alp, tint, num, ring) {
  var fx = a.f, sy = a.sq, i, ph = a.an, mv = abs(a.vx) > .3 && a.g;
  if (!mv && a.g && !a.hold) sy *= 1 + sin(T * 2.8) * .04;   // idle breathing
  var sx = 2 - sy;
  g.save();
  g.translate(a.x, a.y); g.scale(sx * fx, sy); g.globalAlpha = alp;
  // legs
  g.strokeStyle = tint || '#fff'; g.lineWidth = 2.4; g.lineCap = 'round';
  g.beginPath();
  for (i = 0; i < 4; i++) {
    var o = [-3.6, -2.2, 2.2, 3.6][i], p = ph + [0, 2.4, 3.6, 1.1][i], ex = o, ey = 0;
    if (!a.g) { ex = o + (i < 2 ? -2.4 : 2.6); ey = -1.8 - (i < 2 ? 1.4 : 0) }
    else if (mv) { ex = o + sin(p) * 3.4; ey = -max(0, sin(p + 1)) * 3.4 }

    var t0 = i / 6, t1 = (i + 1) / 6;

    g.moveTo(-6 - t0 * 8, -9 + sin(T * 5 - i * .7) * 2.6 * t0 + t0 * t0 * 5);
    g.lineTo(-6 - t1 * 8, -9 + sin(T * 5 - (i + 1) * .7) * 2.6 * t1 + t1 * t1 * 5);
    g.stroke();
  }
  // body
  g.fillStyle = tint || '#fff';
  g.beginPath(); g.ellipse(0, -8, 7.2, 5.2, 0, 0, TAU); g.fill();
  // mane - drawn BEFORE the neck so it falls behind the head, not across the face
  g.lineWidth = 2.35; g.lineCap = 'round';
  for (i = 0; i < 6; i++) {
    var q0 = i / 6, q1 = (i + 1) / 6;
    g.strokeStyle = tint || RB[5 - i];
    g.beginPath();
    g.moveTo(4.4 - q0 * 3.3, -20.8 + q0 * 11.6 + sin(T * 6 - i * .9) * 1.3 * q0);
    g.lineTo(4.4 - q1 * 3.3, -20.8 + q1 * 11.6 + sin(T * 6 - (i + 1) * .9) * 1.3 * q1);
    g.stroke();
  }

  g.beginPath(); g.moveTo(2, -8); g.lineTo(4.4, -17.6); g.lineTo(8.2, -17.2); g.lineTo(6, -7); g.fill();
  g.beginPath(); g.ellipse(7, -17.4, 4.3, 3.7, .25, 0, TAU); g.fill();
  g.beginPath(); g.ellipse(10.4, -16.2, 2.5, 1.9, .35, 0, TAU); g.fill();
  // ears
  g.beginPath(); g.moveTo(4.4, -20); g.lineTo(5.2, -23.8); g.lineTo(7.2, -20.3); g.fill();
  if (!tint) { g.fillStyle = 'rgba(255,170,195,.75)'; g.beginPath(); g.moveTo(5.1, -20.4); g.lineTo(5.4, -22.6); g.lineTo(6.3, -20.5); g.fill(); g.fillStyle = '#fff' }
  // horn: a proper tapered spiral, not a triangle
  var bx0 = 7.7, by0 = -20.3, tx0 = 12.8, ty0 = -29.4, q, tq, qx, qy, qw;
  if (!HG) { HG = g.createLinearGradient(bx0, by0, tx0, ty0);
    HG.addColorStop(0, '#fff6d2'); HG.addColorStop(.5, '#ffcf5e'); HG.addColorStop(1, '#fffbe8') }
  g.fillStyle = tint || HG;
  g.beginPath(); g.moveTo(bx0 - 1.5, by0 - .5); g.lineTo(bx0 + 1.2, by0 + .9); g.lineTo(tx0, ty0); g.closePath(); g.fill();
  if (!tint) {
    g.strokeStyle = 'rgba(158,104,12,.5)'; g.lineWidth = .5;
    g.beginPath();
    for (q = 1; q < 4; q++) {
      tq = q / 4.3; qx = bx0 + (tx0 - bx0) * tq; qy = by0 + (ty0 - by0) * tq; qw = 1.4 * (1 - tq);
      g.moveTo(qx - qw * 1.1, qy + qw * .55); g.lineTo(qx + qw * 1.2, qy - qw * .25);
    }

    g.fillStyle = '#fff'; g.globalAlpha = alp * (.55 + sin(T * 5) * .35);
    g.beginPath(); g.arc(tx0 - .3, ty0 + .5, .62, 0, TAU); g.fill(); g.globalAlpha = alp;
  }

    else { g.beginPath(); g.arc(8.2, -17.9, 1.15, 0, TAU); g.fill(); }
    g.fillStyle = '#fff'; g.beginPath(); g.arc(8.55, -18.3, .42, 0, TAU); g.fill();
    // cheek
    g.fillStyle = 'rgba(255,120,170,' + (.5 - cr * .45) + ')';
    g.beginPath(); g.arc(5.6, -15.8, 1.5, 0, TAU); g.fill();
  } else { g.fillStyle = '#0000'; }
  g.restore();

    g.globalAlpha = .95; g.font = FT(6.5, 1); g.textAlign = 'center';
    g.fillStyle = 'rgba(20,8,30,.55)';
    g.beginPath(); g.ellipse(a.x, a.y - 31.5, 5.2, 4.4, 0, 0, TAU); g.fill();
    g.fillStyle = ring || '#fff'; g.fillText(num, a.x, a.y - 29.4);
    g.textAlign = 'left';
  }
  g.globalAlpha = 1;
}

// ---------- tiles ----------
function chasm(g) {                       // depth under the world so pits read as pits
  g.fillStyle = chG; g.fillRect(0, gndY - 6, W, H - gndY + 6);
}
function tiles(g) {
  var cx, cy, i, t, p, x, y, w = cr > .6;
  for (cy = 0; cy < GH; cy++) for (cx = 0; cx < GW; cx++) {
    i = idx(cx, cy); t = TT[i]; if (!t) continue;
    p = TP[i]; x = cx * TS; y = cy * TS;
    if (t == SOLID) {
      var up = cy > 0 && (TT[i - GW] == 0 || TT[i - GW] == CLOUD || TT[i - GW] == GOAL);
      var dn = cy < GH - 1 && TT[i + GW] != SOLID && TT[i + GW] != PLATE;
      g.fillStyle = w ? '#3b3048' : '#b4794e';
      if (dn) {                                   // tapered underside: a floating island
        g.beginPath(); g.moveTo(x, y); g.lineTo(x + TS, y);
        g.lineTo(x + TS - 2.5, y + TS - 1); g.lineTo(x + 2.5, y + TS - 1); g.closePath(); g.fill();
      } else g.fillRect(x, y, TS, TS);
      g.fillStyle = w ? '#2e2539' : '#96603c';
      if (dn) { g.beginPath(); g.moveTo(x + 1, y + TS - 5); g.lineTo(x + TS - 1, y + TS - 5); g.lineTo(x + TS - 2.5, y + TS - 1); g.lineTo(x + 2.5, y + TS - 1); g.closePath(); g.fill() }

        g.lineTo(x + TS, y + 6); g.fill();

        g.fillRect(x, y + 4.4, TS, 1.6);
      }
    } else if (t == CLOUD) {
      g.fillStyle = w ? 'rgba(190,180,205,.85)' : 'rgba(255,255,255,.93)';
      g.beginPath();
      g.ellipse(x + 4, y + 6, 5, 4.2, 0, 0, TAU); g.ellipse(x + 12, y + 6, 5, 4.2, 0, 0, TAU);
      g.ellipse(x + 8, y + 4.5, 6, 4.6, 0, 0, TAU); g.fill();
      g.fillStyle = 'rgba(150,170,220,.35)';

// ---------- beams ----------
// a beam carries a colour mask; we draw it as one stripe per component, so a

    L = hyp(x2 - x1, y2 - y1) || 1; nx = (x2 - x1) / L; ny = (y2 - y1) / L;

// ---------- sky ----------
var skyG = 0, skyC = -1;
function sky(g) {

    skyC = k; skyG = g.createLinearGradient(0, 0, 0, H);
    var top = ['#8fd8ff', '#8fd0f4', '#9aa9d8', '#6a6690', '#3a2f50', '#180d22'][k];
    var bot = ['#ffd8ee', '#f8cfe2', '#d9b8d2', '#9a7ea6', '#523a5c', '#25102c'][k];

    g.fillStyle = cr > .6 ? ['rgba(78,64,98,.38)', 'rgba(64,50,82,.6)', 'rgba(50,38,66,.85)'][l]
                          : ['rgba(198,226,214,.4)', 'rgba(176,214,190,.55)', 'rgba(146,200,164,.7)'][l];
    g.beginPath(); g.moveTo(-20, H + 20);
    for (var hx = -20; hx <= W + 20; hx += 16)

// st: 0 title/select  1 play  2 curtain call  3 ending

var POST = ("THE END OF THE RAINBOW IS THIS WAY!|SHE WILL WAIT HERE. SHE DOESN'T MIND.|" +

function loop(now) {

  inputPoll();

  if (st == 1 && MP & 128) { pz ^= 1; if (A) pz ? A.suspend() : A.resume() }   // freeze the song WITH the sim
  if (pz) {
    if (KP & 4 || KP & 1) { msel += 2; msel %= 3 }
    if (KP & 8 || KP & 2) msel = (msel + 1) % 3;
    if (MP & 1) {
      if (msel == 1) { pz = 0; ghosts = []; resetWorld(); if (A) A.resume() }
